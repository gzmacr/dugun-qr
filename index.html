<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gizem & Görkem | Düğün Albümü</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="names">
Gizem &amp; Görkem
</div>

<div class="date">
08.08.2026
</div>

<div class="invitation">
<img src="assets/invitation.jpg" alt="Davetiye">
</div>

<div class="message">

❤️Mutlu günümüzde bizimle olduğunuz için teşekkür ederiz.❤️
 Sadece tıkla ve galerinden göndermek istediğin anıları bizimle paylaş...

</div>

<form id="uploadForm">

<label>

📷 Fotoğraf veya Video Paylaş

</label>

<input
type="file"
id="files"
multiple
accept="image/*,video/*">

<label>

💌 İsterseniz bize küçük bir not bırakabilirsiniz...

</label>

<textarea
id="note"
placeholder="Mesajınızı buraya yazabilirsiniz..."></textarea>

<div class="progress">

<div class="progress-bar" id="bar"></div>

</div>

<button type="submit">

🤍 Anılarımızı Gönder

</button>

</form>

<div class="footer">

Sevginizi bizimle paylaştığınız için teşekkürler ❤️

</div>

</div>

<script src="script.js"></script>

</body>
</html>
