<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merve & Ahmet | Düğün Albümü</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#fffdf8,#f7efe2);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.card{

max-width:430px;

width:100%;

background:white;

padding:40px 30px;

border-radius:25px;

box-shadow:0 15px 35px rgba(0,0,0,.12);

text-align:center;

}

h1{

font-size:34px;

color:#7a5b2d;

margin-bottom:15px;

}

h2{

font-size:18px;

font-weight:400;

color:#555;

margin-bottom:35px;

line-height:30px;

}

button{

width:100%;

padding:18px;

border:none;

border-radius:14px;

cursor:pointer;

font-size:18px;

margin-top:15px;

transition:.3s;

font-weight:600;

}

.camera{

background:#b48b45;

color:white;

}

.gallery{

background:#ece6dc;

color:#444;

}

button:hover{

transform:scale(1.03);

}

.footer{

margin-top:35px;

font-size:14px;

color:#888;

}

.heart{

font-size:42px;

margin-bottom:20px;

}

</style>

</head>

<body>

<div class="card">

<div class="heart">💍</div>

<h1>Merve & Ahmet</h1>

<h2>

Mutlu günümüzde çektiğiniz fotoğrafları bizimle paylaşmanız bizi çok mutlu eder ❤️

</h2>

<button class="camera">

📷 Fotoğraf Çek

</button>

<button class="gallery">

🖼️ Galeriden Fotoğraf Seç

</button>

<div class="footer">

Teşekkür ederiz 🤍

</div>

</div>

</body>

</html>
